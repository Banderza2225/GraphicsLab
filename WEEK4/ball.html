<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Canvas</title>
    <style type="text/css">
        body {
            background-color: white;
        }

        canvas {
            border: 1px solid #000000;
        }
    </style>
</head>

<body>
    <h1>mohammed</h1>
    <canvas id="canvas-for-ball" width="500" height="500"></canvas>

    <script type="text/javascript">
        var canvas = document.getElementById("canvas-for-ball");
        var ctx = canvas.getContext("2d");

        class Ball {
            constructor(x, y, xspeed, yspeed, radius, color) {
                this.x = x;
                this.y = y;
                this.xspeed = xspeed;
                this.yspeed = yspeed;
                this.r = radius;
                this.color = color;
            }


            move() {
                this.x += this.xspeed;
                this.y += this.yspeed;
                if (this.y >= 500) {
                    this.yspeed = -1 * this.yspeed;
                }
                if (this.y <= 0) {
                    this.yspeed = -1 * this.yspeed;
                }
                if (this.x >= 500) {
                    this.xspeed = -1 * this.xspeed;
                }
                if (this.x <= 0) {
                    this.xspeed = -1 * this.xspeed;
                }
            }


            draw() {
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
                ctx.fill();
            }



        }


        class Paddle {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.r = radius;
                this.score = 0;
            }


            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
                ctx.fill();
            }



        }





        var myBall = new Ball(100, 10, 4, 4, 8, "red");
        var paddle = new Paddle(250, 450, 20);
        var collisionMessage = "";
        var messageTimer = 0;
      
        canvas.addEventListener("mousemove", function (event) {
            var rect = canvas.getBoundingClientRect();
            paddle.x = event.clientX - rect.left;
            paddle.y = event.clientY - rect.top;
        });


        window.addEventListener("keydown", function (event) {

            


        });


        function checkCollision(b1, b2) {
            var dx = b1.x - b2.x;
            var dy = b1.y - b2.y;
            var distance = Math.sqrt(dx * dx + dy * dy);
            return distance < (b1.r + b2.r);
        }


        function repeatme() {
            ctx.clearRect(0, 0, 500, 500);

            paddle.draw();
            myBall.move();
            myBall.draw();

            if (checkCollision(paddle, myBall)) {
                myBall.xspeed = -1 * myBall.xspeed;
                myBall.yspeed = -1 * myBall.yspeed;
                paddle.score++;
                collisionMessage = "Collision Detected!";
                messageTimer = 60;
            }

            if (myBall.y <= 0) {
                paddle.score--;
            }

            ctx.fillStyle = "black";
            ctx.font = "16px Arial";
            ctx.fillText("Score: " + paddle.score, 10, 25);

            if (messageTimer > 0) {
                ctx.fillStyle = "black";
                ctx.font = "16px Arial";
                ctx.fillText(collisionMessage, 200, 50);
                messageTimer--;
            }

            window.requestAnimationFrame(repeatme);
        }

        repeatme();
    </script>
</body>

</html>
