<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js Atmospheric CO2 and Climate Data Exercise</title>
    
    <!-- 2. Include D3.js (V7) via CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
       
    </style>
</head>
<body>

   
    <h1>sultan qureshi </h1>
    <p>D3.js Atmospheric CO2, Temperature Anomaly, and Methane Visualization</p>

    <div class="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        
        const dataSourceUrl = "https://raw.githubusercontent.com/humphs078/programming_for_data_analysis_assignment_2/refs/heads/main/datasets/fused_datasets/json/long_term_fused_data.json";

        d3.json(dataSourceUrl).then(function(data) {
           
            console.log("Downloaded JSON Data:", data);

            plotCO2Data(data);

        }).catch(function(error) {
            console.error("Error loading JSON data:", error);
        });

        function plotCO2Data(data) {
           
            const margin = { top: 20, right: 30, bottom: 50, left: 60 };
            const width = 800 - margin.left - margin.right;
            const height = 400 - margin.top - margin.bottom;

            const x = d3.scaleLinear()
                .domain(d3.extent(data, d => d.years_before_2023 ))
                .range([0, width]);


            const y = d3.scaleLinear()
                .domain([d3.min(data, d => d.co2_ppmv), d3.max(data, d => d.co2_ppmv)])
                .range([height, 0]);


                var  xAxis = d3.axisBottom(x).ticks(3);

                var  yAxis = d3.axisLeft(y).ticks(3);
 
                var valueline = d3.line()
                    .x(d => x(d.years_before_2023)).y(d => y(d.co2_ppmv));

                    var svg = d3.select("#chart")
                        .append("svg")
                        .attr("width", width + margin.left + margin.right)
                        .attr("height", height + margin.top + margin.bottom)
                        .append("g")
                        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");


                        svg.append("g").attr("class", "x axis").attr("transform", "translate(0," + height + ")").call(xAxis);
                        svg.append("g").attr("class", "y axis").call(yAxis);
//axis to svg 

                        svg.append("path")
                            .data([data])
                            .attr("class", "line")
                            .attr("d", valueline)
                            .style("fill", "none")
                            .style("stroke", "red")//makes line red
                            .style("stroke-width", "2px");
        }


       
    </script>
</body>
</html>
