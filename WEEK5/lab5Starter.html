<!DOCTYPE html>
<html>
<!--Import three.js-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Mohammed Sultan Qureshi</h1>
    <script type="text/javascript">
        
        // Canvas width and height parameters
        var canvasWidth = window.innerWidth;
        var canvasHeight = window.innerHeight;

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // added sphere to the canvas
        var sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: false })  // set wireframe to false to make the sphere solid
        );
        scene.add(sphere);

        // Add a spotlight to the scene
        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(1, 0.5, 1);
        scene.add(spotLight);

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, canvasWidth / canvasHeight, 0.1, 1000); 
        // Set camera position
        camera.position.z = 5;

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(canvasWidth, canvasHeight);// set the size to the canvas width and height
        document.body.appendChild(renderer.domElement);

        // Animation loop to rotate the sphere and render the scene
        function repeatMe() {
            requestAnimationFrame(repeatMe);
            sphere.rotation.x += 0.01;
            sphere.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        repeatMe();
        
    </script>
</body>

</html>
