<!DOCTYPE html>
<html>
<!--Import three.js-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title></title>
    <style type="text/css">
    </style>
</head>

<body>
    <h1>Mohammed Sultan Qureshi</h1>
    <script type="text/javascript">
        
        // Canvas width and height parameters
        var canvasWidth = window.innerWidth;
        var canvasHeight = window.innerHeight;

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // created a Ball class to encapsulate the sphere's properties and behavior
        class Ball {
            constructor(radius, floorY, topY) {
                this.radius = radius;
                this.floorY = floorY;
                this.topY = topY;
                this.speedY = -0.05;
                this.mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(radius, 16, 16),
                    new THREE.MeshLambertMaterial({ color: 0x00ff00, wireframe: false })
                );
                this.speedX = 0.03;
                this.mesh.position.y = topY;
            }
            update() {
                this.mesh.rotation.x += 0.01;
                this.mesh.rotation.y += 0.01;
                this.mesh.position.x += this.speedX;
                if (Math.abs(this.mesh.position.x) > 4) { this.speedX = -this.speedX; }
                this.mesh.position.y += this.speedY;
                if (this.mesh.position.y - this.radius <= this.floorY) { this.speedY = Math.abs(this.speedY); }
                if (this.mesh.position.y >= this.topY) { this.speedY = -Math.abs(this.speedY); }
            }
        }
        var ball = new Ball(1, -3, 3);
        ball.mesh.castShadow = true;
        scene.add(ball.mesh);

        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(-3, 10, 3);
        spotLight.castShadow = true;
        scene.add(spotLight);
        scene.add(new THREE.CameraHelper(spotLight.shadow.camera));

        var plane = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshLambertMaterial({ color: 0xcccccc })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -3;
        plane.receiveShadow = true;
        scene.add(plane);

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, canvasWidth / canvasHeight, 0.1, 1000);
        // Set camera position
        camera.position.set(0, 3, 8);
        camera.lookAt(0, -1, 0);

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(canvasWidth, canvasHeight);
        document.body.appendChild(renderer.domElement);
        renderer.shadowMap.enabled = true;
 // Animation loop to rotate the sphere and render the scene
        function repeatMe() {
            requestAnimationFrame(repeatMe);
            ball.update();
    renderer.render(scene, camera);
        }
        repeatMe();
        
    </script>
</body>

</html>
